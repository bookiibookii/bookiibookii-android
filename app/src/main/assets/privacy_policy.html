<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            color: #333333;
            line-height: 1.6; /* 읽기 편하게 줄간격 살짝 넓힘 */
            word-break: keep-all; /* 단어 단위로 줄바꿈 되도록 설정 */
        }

        * {
            font-size: 14px !important; /* 원하는 폰트 크기로 조절하세요 (예: 13px, 14px) */
            font-weight: normal !important; /* 제목의 굵은 글씨도 일반 굵기로 강제 변경 */
        }
    </style>
</head>
